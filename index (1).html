<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1 class="logo">TREE</h1>
  <p class="tag">Build Discipline. Grow Strong.</p>

  <div class="card">

    <div class="tree-area">
      <svg id="treeSVG" viewBox="0 0 200 300">
        <rect x="90" y="180" width="20" height="80" fill="#5D4037"/>
        <circle id="leaf1" cx="100" cy="150" r="30" fill="#2E7D32"/>
        <circle id="leaf2" cx="70" cy="170" r="25" fill="#388E3C"/>
        <circle id="leaf3" cx="130" cy="170" r="25" fill="#43A047"/>
      </svg>
    </div>

    <div id="timer">0d 0h 0m 0s</div>

    <button class="fail" onclick="resetTree()">I Failed Today</button>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
